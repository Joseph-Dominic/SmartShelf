log:
  level: INFO

entryPoints:
  web:
    # http
    address: ':80'
    # NOTE: When you attach a custom domain with SSL later, uncomment the redirection below:
    # http:
    #   redirections:
    #     entryPoint:
    #       to: web-secure

  web-secure:
    # https
    address: ':443'

# --- SSL / Let's Encrypt (Uncomment when you connect a custom domain later) ---
# certificatesResolvers:
#   letsencrypt:
#     acme:
#       email: 'josephdominic0023@gmail.com'
#       storage: /etc/traefik/acme/acme.json
#       httpChallenge:
#         entryPoint: web

http:
  routers:
    # --- HTTP Routing (Works immediately with any IP address or host) ---
    web-router:
      rule: 'PathPrefix(`/`)'
      entryPoints:
        - web
      middlewares:
        - csrf
      service: django

    web-media-router:
      rule: 'PathPrefix(`/media/`)'
      entryPoints:
        - web
      middlewares:
        - csrf
      service: django-media

    # --- HTTPS Routing (Uncomment when you connect a custom domain later) ---
    # web-secure-router:
    #   rule: 'Host(`yourdomain.com`)'
    #   entryPoints:
    #     - web-secure
    #   middlewares:
    #     - csrf
    #   service: django
    #   tls:
    #     certResolver: letsencrypt
    #
    # web-media-secure-router:
    #   rule: 'Host(`yourdomain.com`) && PathPrefix(`/media/`)'
    #   entryPoints:
    #     - web-secure
    #   middlewares:
    #     - csrf
    #   service: django-media
    #   tls:
    #     certResolver: letsencrypt

  middlewares:
    csrf:
      # https://doc.traefik.io/traefik/master/middlewares/http/headers/#hostsproxyheaders
      # https://docs.djangoproject.com/en/dev/ref/csrf/#ajax
      headers:
        hostsProxyHeaders: ['X-CSRFToken']

  services:
    django:
      loadBalancer:
        servers:
          - url: http://django:5000

    django-media:
      loadBalancer:
        servers:
          - url: http://nginx:80

providers:
  # https://doc.traefik.io/traefik/master/providers/file/
  file:
    filename: /etc/traefik/traefik.yml
    watch: true
