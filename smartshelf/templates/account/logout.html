{% extends "base.html" %}
{% load i18n allauth account %}

{% block title %}{% translate "Sign Out" %} - SmartShelf{% endblock title %}

{% block content %}
<div class="container px-5 my-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-4 text-center p-4 p-sm-5">
        <div class="bg-danger-subtle text-danger rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 60px; height: 60px;">
          <i class="bi bi-box-arrow-right fs-3"></i>
        </div>
        <h3 class="fw-bold mb-2">Sign Out</h3>
        <p class="text-muted small mb-4">Are you sure you want to end your current SmartShelf session?</p>
        <form method="post" action="{% url 'account_logout' %}">
          {% csrf_token %}
          <div class="d-grid gap-2">
            <button type="submit" class="btn btn-danger btn-lg fw-semibold">Yes, Sign Out</button>
            <a href="{% url 'home' %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
