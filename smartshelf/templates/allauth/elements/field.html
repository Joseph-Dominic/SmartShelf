{% load allauth %}
<div class="mb-3">
  {% if attrs.label %}
    <label for="{{ attrs.id }}" class="form-label small fw-semibold text-muted">{{ attrs.label }}</label>
  {% endif %}
  {% slot %}
  {% endslot %}
  {% if attrs.errors %}
    <div class="invalid-feedback d-block small mt-1">
      {% for error in attrs.errors %}
        <div>{{ error }}</div>
      {% endfor %}
    </div>
  {% endif %}
  {% if attrs.help_text %}
    <div class="form-text small text-muted">{{ attrs.help_text }}</div>
  {% endif %}
</div>
