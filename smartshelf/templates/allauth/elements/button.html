{% load allauth %}
{% if attrs.type == "submit" %}
  <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold mt-2">
    {% slot %}{% endslot %}
  </button>
{% else %}
  <button type="{{ attrs.type|default:'button' }}" class="btn btn-outline-secondary btn-sm">
    {% slot %}{% endslot %}
  </button>
{% endif %}
